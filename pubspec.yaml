name: chorus
description: >-
  A Dart port of pi's agent toolkit (earendil-works/pi): one API over LLM providers and an agent loop.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  anthropic_sdk_lite_dart: ^0.1.0
  # Not on pub.dev yet.
  openai_sdk_lite_dart:
    git:
      url: https://github.com/kamora/openai-sdk-lite-dart.git
      ref: 7f54979a3b3800936b57c33f86bb11a7962298de
  http: ^1.6.0
  http_parser: ^4.1.2
  pluto: ^0.0.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
