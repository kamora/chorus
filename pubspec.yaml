name: chorus
description: >-
  Build AI agents in Dart with one API for Anthropic, OpenAI and Google models: streaming, tools, thinking and an
  agent loop. A port of pi's agent toolkit.
version: 0.2.0
repository: https://github.com/kamora/chorus
topics: [ai, llm, agents, anthropic, openai]

environment:
  sdk: ^3.13.5

dependencies:
  anthropic_sdk_lite_dart: ^0.1.0
  google_sdk_lite_dart: ^0.1.0
  http: ^1.6.0
  http_parser: ^4.1.2
  openai_sdk_lite_dart: ^0.1.0
  pluto: ^0.0.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
